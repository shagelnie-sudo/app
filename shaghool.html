<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>شغلني - شَغّول</title><style>
:root{--navy:#12305a;--green:#3fae5a;--bg:#f4f6f9;--card:#fff;--text:#16233a;--muted:#6b7a90;--line:#e3e8ef;--ub:#12305a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#172236;--text:#e8eef7;--muted:#93a3ba;--line:#26344c;--ub:#2a5ba8}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#172236;--text:#e8eef7;--muted:#93a3ba;--line:#26344c;--ub:#2a5ba8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);font-weight:800;font-size:20px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#fff}}
#chat{flex:1;overflow-y:auto;padding:12px 14px}
.row{display:flex;gap:8px;margin:9px 0;align-items:flex-end}
.row.u{justify-content:flex-start}.row.s,.row.c{justify-content:flex-end}
.av{flex:none;width:30px;height:30px}
.b{max-width:78%;padding:10px 13px;border-radius:16px;line-height:1.7}
.u .b{background:var(--ub);color:#fff;border-bottom-right-radius:4px}
.s .b{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--green);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.srch{color:var(--muted)}
.cards{width:calc(100% - 38px);display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;align-items:center;gap:11px}
.ini{flex:none;width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.inf{flex:1;min-width:0}.inf b{display:block}.inf small{color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:7px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.p{background:var(--green);color:#fff;font-weight:700}
.g{background:transparent;border:1px solid var(--line);color:var(--text)}
#chips{padding:0 14px 6px;display:flex;gap:7px;flex-wrap:wrap}
#chips button{background:var(--card);border:1px solid var(--green);color:var(--text);border-radius:99px}
#comp{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#inp{flex:1;font:inherit;padding:11px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#go{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;padding:0;font-size:18px}
#sh{position:absolute;inset:0;background:rgba(8,16,30,.5);display:none;align-items:flex-end}
#sh.on{display:flex}
#sh>div{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.st{display:flex;gap:8px;margin:14px 0}.st div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:9px 4px}.st b{display:block}.st small{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:0 0 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.s .b{background:linear-gradient(#eaf6ec,#dff1e3);border:1px solid #d3e9d8;color:#16233a;border-bottom-left-radius:8px}
.tm{font-size:12px;color:#6b7a90;margin-top:4px}.u .tm{direction:ltr;text-align:left;color:#6b7a90}

#comp{direction:ltr;background:transparent;border:0;padding:8px 12px 12px;align-items:center}

const $=s=>document.querySelector(s),chat=$('#chat'),inp=$('#inp'),chips=$('#chips');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let app,au,db,doc,getDoc,collection,getDocs,query,where,limit,addDoc,serverTimestamp,onAuthStateChanged;
let P=null,busy=false,warned=0,R=[],RK=false,JM={};const Q=[],H=[];
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const dk=x=>(P&&P.lat!=null&&x.lat!=null)?km(P.lat,P.lng,x.lat,x.lng):1e9;
const mins=x=>Math.max(1,Math.round(dk(x)*1.3/30*60));
const dist=x=>dk(x)>=1e9?'':`<span class="dbadge">📍 ${dk(x).toFixed(1)} كم</span>`;
const tm=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
function add(k,h,e){const r=document.createElement('div');r.className='row '+k;let x;
 if(k==='c')x=h;
 else if(k==='u')x=`<span class="ua">👤</span><div class="b">${h}<div class="tm">${tm()} ✓✓</div></div>`;
 else{const st=ST[e]?`<img class="stk" src="${ST[e]}" alt="">`:'',t=h.includes('class="dots"')&&!ST[e];x=`<div class="b${st?' big':''}"><div class="tx">${h}${t?'':`<div class="tm">${tm()}</div>`}</div>${st}</div><img class="av" src="${AV}" alt="">`}
 r.innerHTML=x;chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r}
const DOTS='<span class="dots"><i></i><i></i><i></i></span>';
async function say(h,e='calm',pre=750,pe='think'){const t=add('s',DOTS,pe);await wait(pre);t.remove();return add('s',h,e)}
const setChips=a=>{chips.innerHTML=a.map(x=>`<button>${x}</button>`).join('')};
const tel=p=>String(p||'').replace(/[^\d+]/g,'');
const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='249'+d.slice(1);return d};
const ago=t=>{if(!t)return'';const m=(Date.now()/1000-t)/60;return m<60?'منذ '+Math.max(1,Math.round(m))+' دقيقة':m<1440?'منذ '+Math.round(m/60)+' ساعة':'منذ '+Math.round(m/1440)+' يوم'};
const loc=x=>[x.state,x.city].filter(Boolean).join(' - ');
const logo=(u,t)=>`<div class="jl">${u?`<img src="${esc(u)}" alt="">`:esc((t||'؟')[0])}</div>`;
const sk=a=>(a||[]).slice(0,4).map(k=>`<span class="sk">${esc(k)}</span>`).join('');
const cut=(t,n,d)=>{t=t||d;return esc(t.slice(0,n))+(t.length>n?'…':'')};
const jobC=j=>`<div class="jc"><div class="jh">${logo(j.logo,j.company)}<div><div class="jt">${esc(j.title||'وظيفة')}</div><div class="jco" ${j.employerId?`data-go="profile.html?uid=${esc(j.employerId)}"`:''}>${esc(j.company||'جهة غير محددة')}</div></div></div><div class="jb">${j.jobType?`<span class="bg1">${esc(j.jobType)}</span>`:''}${dist(j)}</div>${sk(j.skills)}<p class="jd">${cut(j.desc,130,'لا يوجد وصف')}</p><div class="jf"><div class="jm">${j.salary?`<b>${esc(j.salary)}</b>`:''}📍 ${esc(loc(j)||'—')}${j.posted?' · '+ago(j.posted):''}</div>${P&&P.role=='seeker'?`<button class="ab" data-ap="${esc(j.id)}">تقدّم الآن</button>`:''}</div></div>`;
const seekC=s=>`<div class="jc"><div class="jh">${logo(s.photo,s.name)}<div><div class="jt">${esc(s.name)}</div><div class="jco" data-go="profile.html?uid=${esc(s.id)}">${esc(s.profession||'باحث عن عمل')}</div></div></div><div class="jb">${s.status?`<span class="bg1">${esc(s.status)}</span>`:''}${dist(s)}</div>${sk(s.skills)}<p class="jd">${cut(s.about,130,'لا توجد نبذة شخصية')}</p><div class="jf"><div class="jm">📍 ${esc(loc(s)||'—')}${s.experience?' · الخبرة: '+esc(s.experience):''}</div><a class="ab" href="chat.html?employeeId=${esc(s.id)}&employeeName=${encodeURIComponent(s.name||'')}&employeePhoto=${encodeURIComponent(s.photo||'')}">تواصل</a></div></div>`;
async function apply(id,btn){const j=JM[id];if(!j||!P.uid)return;btn.disabled=true;
 try{const q=await getDocs(query(collection(db,'applications'),where('employeeId','==',P.uid),where('jobId','==',id)));
  if(q.empty){await addDoc(collection(db,'applications'),{employeeId:P.uid,employeeName:P.dn||P.name||'متقدم',employeePhoto:null,jobId:id,jobTitle:j.title||'',companyName:j.company||'',employerId:j.employerId||null,status:'pending',appliedAt:serverTimestamp()});
   if(j.employerId)await addDoc(collection(db,'notifications'),{userId:j.employerId,type:'application',message:(P.dn||P.name||'متقدم جديد')+' تقدّم لوظيفة "'+(j.title||'')+'"',link:'profile.html',read:false,timestamp:serverTimestamp()})}
  btn.textContent='تم التقديم ✓';add('s','تمام، قدّمت ليك على «'+esc(j.title)+'». صاحب العمل بيوصله إشعار.','happy')}
 catch(e){btn.disabled=false;add('s','ما قدرت أقدّم: '+esc(e.code||e.message))}}
const STOP=new Set(['عايز','عايزه','محتاج','ابحث','شغل','وظيفه','وظايف','عمل','في','من','انا','ليك','لي','عن','ممكن','اريد','مين','موظف','ابي']);
const RP=[[/مكيف|تكييف|سبلت/,['مكيف','تكييف','تبريد','فني']],[/فرن|بوتجاز/,['فرن','فني','اجهزه']],[/حنفي|مواسير|سباك|تسريب/,['سباك','حنفيه','فني']],[/كهرب|فيوز/,['كهربائي','كهرباء','فني']]];
const SM=[[/مرحبا|سلام|اهلا|هلا|صباح|مساء/,'أهلًا بيك! أنا شَغّول 👋 قول لي محتاج شنو: وظيفة، عمال، ولا فني لعطل؟'],[/من انت|مين انت|منو انت|شنو انت/,'أنا شَغّول، مساعد شغلني. بفتش ليك عن وظائف أو عمال أو فنيين.'],[/كيف حالك|كيفك|اخبارك|شلونك/,'الحمد لله تمام! محتاج شنو اليوم؟'],[/شكرا|يعطيك|تسلم/,'العفو يا زول، في الخدمة.']];
async function ai(t){if(!WORKER)return null;try{const c=new AbortController();setTimeout(()=>c.abort(),9000);const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:P.role,text:t,history:H.slice(-6)}),signal:c.signal});const j=await r.json();if(j&&typeof j.reply=='string')return j;return{fail:String((j&&j.error)||'رد غير متوقع')}}catch(e){return{fail:String(e.message||e)}}}
async function find(w,cn,pp){let a;
 if(pp){const s=await getDocs(query(collection(db,'employees'),limit(300)));a=s.docs.map(d=>{const v=d.data(),l=v.contact?.location||{};return{id:d.id,name:v.name,profession:v.headline,about:v.bio,experience:v.experience,status:v.jobStatus,phone:v.contact?.phone,city:l.city,area:l.area,state:l.state,lat:l.lat,lng:l.lng,skills:v.skills||[],photo:v.profileImageUrl}}).filter(x=>!/غير|لا\s*[اأإ]?بحث/.test(x.status||''))}
 else{const s=await getDocs(query(collection(db,'jobs'),where('status','==','active'),limit(300)));a=s.docs.map(d=>{const v=d.data(),l=v.location||{};return{id:d.id,title:v.title,desc:v.description,company:v.companyName,employerId:v.employerId,city:l.city,state:l.state,lat:l.lat,lng:l.lng,posted:v.postedAt?.seconds,jobType:v.jobType,salary:v.salaryText,skills:v.skillsRequired||[],logo:v.employerLogoUrl}})}
 a=a.filter(x=>{const h=norm([x.name,x.profession,x.about,x.title,x.desc,x.company,x.city,x.area,x.state,x.experience,(x.skills||[]).join(' ')].join(' '));return w.some(k=>h.includes(k))});
 const cm=x=>cn&&norm(x.city||'').includes(cn)?0:1;return a.sort((x,y)=>(cm(x)-cm(y))||(dk(x)-dk(y))).slice(0,3)}
async function run(t){if(!P){add('s','جاري تحميل حسابك… أعد المحاولة بعد لحظات.');return}H.push({r:'u',t});const emp=P.role=='employer';
 const d=add('s',DOTS,'think');const j=await ai(t);let w=[],ready=false,cn='',reply=null,pp=emp;
 if(j&&!j.fail){reply=j.reply;w=(j.keywords||[]).map(x=>norm(x).replace(/^ال/,'')).filter(x=>x.length>1);cn=j.city&&j.city!='null'?norm(j.city):'';pp=j.target?j.target=='people':emp;ready=j.ready!==false&&w.length>0}
 else{if(j&&j.fail&&!warned){warned=1;add('s','⚠️ الذكاء الاصطناعي غير متصل حاليًا ('+esc(j.fail.slice(0,120))+')، سأرد بالبحث البسيط.')}
  const n=norm(t),sm=SM.find(x=>x[0].test(n)),r=RP.find(x=>x[0].test(n));
  if(sm){reply=sm[1]}else if(r){w=r[1];pp=true;ready=true}else{w=n.split(/\s+/).filter(x=>x.length>2&&!STOP.has(x)).map(x=>x.replace(/^ال/,''));ready=w.length>0}}
 await wait(500);d.remove();
 if(reply){add('s',esc(reply),'calm');H.push({r:'s',t:reply})}
 if(!ready){if(!reply)add('s','وريني نوع الشغل أو العطل بالضبط، وأنا أفتش ليك.');return}
 const sr=add('s','<span class="srch">شَغّول بفتش ليك'+DOTS+'</span>','search');await wait(1800);
 const a=await find(w,cn,pp);sr.remove();
 if(!a.length){add('s','فتشت في شغلني وما لقيت حاجة مناسبة حاليًا.','calm');return}
 R=a;RK=pp;a.forEach(x=>JM[x.id]=x);add('s',`لقيت ليك ${a.length} ${pp?'أشخاص مناسبين':'وظائف مناسبة'}${dk(a[0])<1e9?'، وأقربهم يبعد حوالي '+dk(a[0]).toFixed(1)+' كم منك':''}.<br>شوف أقرب الخيارات 👇`,'happy');
 add('c',`<div class="jcs">${a.map(x=>pp?seekC(x):jobC(x)).join('')}</div>`);
 if(P.lat==null)add('s','حدّد موقعك في ملفك الشخصي عشان أقول ليك كم تبعد عنك.','calm')}
async function send(txt){txt=String(txt).trim();if(!txt)return;inp.value='';inp.focus();add('u',esc(txt));Q.push(txt);if(busy)return;busy=true;
 while(Q.length){setChips([]);try{await run(Q.shift())}catch(e){add('s','حصلت مشكلة: '+esc(e.code||e.message))}}busy=false}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.href=g.dataset.go;return}
 const ap=e.target.closest('[data-ap]');if(ap){apply(ap.dataset.ap,ap);return}
 const b=e.target.closest('button');if(b&&b.parentElement===chips)send(b.textContent)});
document.addEventListener('mousedown',e=>{if(e.target.closest('#go,#plus,#chips button'))e.preventDefault()});
$('#go').addEventListener('click',()=>send(inp.value));
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send(inp.value)});
document.querySelector('header .ic').onclick=()=>history.length>1?history.back():location.href='index.html';
if(window.visualViewport){const f=()=>{$('#app').style.height=visualViewport.height+'px';window.scrollTo(0,0);chat.scrollTop=chat.scrollHeight};visualViewport.addEventListener('resize',f);visualViewport.addEventListener('scroll',()=>window.scrollTo(0,0))}
window.addEventListener('error',e=>add('s','⚠️ خطأ: '+esc(e.message)));
window.addEventListener('unhandledrejection',e=>add('s','⚠️ خطأ: '+esc((e.reason&&e.reason.message)||e.reason)));
try{const V='https://www.gstatic.com/firebasejs/10.12.2/';
 const[A,Au,Fs]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
 ({doc,getDoc,collection,getDocs,query,where,limit,addDoc,serverTimestamp}=Fs);({onAuthStateChanged}=Au);
 app=A.initializeApp(cfg);au=Au.getAuth(app);db=Fs.getFirestore(app)}
catch(e){add('s','⚠️ تعذّر تحميل Firebase: '+esc(e.message)+' — تحقق من الاتصال بالإنترنت.')}
async function loadMe(u){let s=await getDoc(doc(db,'employees',u.uid));
 if(s.exists()){const d=s.data(),l=d.contact?.location||{};return{role:'seeker',name:d.name,lat:l.lat,lng:l.lng}}
 s=await getDoc(doc(db,'All_jops',u.uid));
 if(s.exists()){const d=s.data(),l=d.companyInfo?.location||{};return{role:'employer',name:d.companyInfo?.name||d.name,lat:l.lat,lng:l.lng}}
 return{role:'seeker'}}
if(db)onAuthStateChanged(au,async u=>{if(!u){location.href='login.html';return}
 try{P=await loadMe(u)}catch(e){P={role:'seeker'}}
 P.uid=u.uid;P.dn=u.displayName||'';
 await say('أها، محتاج شنو اليوم؟ 👀','calm',600);
 setChips([P.role=='employer'?'محتاج عمال لمحل حلويات':'عايز شغل محاسب','المكيف بقى ما بارد'])});
</script></body></html>
